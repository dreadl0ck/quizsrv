#                    Build System
#                          v0.8.5
#



# default language
language: bash

# globals for all commands
globals:
    # Current deployment; image targets require explicit source/release inputs.
    # A git push does not deploy this docker-source application.
    VERSION: v0.3.20
    # The build previously tagged dreadl0ck/quizsrv, which is Docker Hub and is
    # not where anything deploys from. sne.dreadl0ck.net pulls this:
    IMAGE: registry.amsterdam-technologies.com/library/quizsrv

# command data
commands:
    
    # build the binary
    build:
        description: build project
        dependencies:
            - clean
        buildNumber: true
        exec: |
            go build -o bin/quizsrv

    run-local:
        description: run the server locally
        exec: go run .

    # clean up the mess
    clean:
        description: clean up to prepare for build
        exec: rm -rf bin/*

    make-docker:
        dependencies:
            - build-docker
            - push-docker
        exec: echo done

    build-docker:
        description: build docker container
        exec: |
            set -eu
            : "${SOURCE_MANIFEST:?package committed source first}"
            : "${RELEASE_OUTPUT:?select a new output directory}"
            : "${RELEASE_IMAGE:?select an explicit new release tag}"
            python3 release.py "$SOURCE_MANIFEST" "$RELEASE_OUTPUT" "$RELEASE_IMAGE"
    push-docker:
        exec: |
            set -eu
            : "${SOURCE_MANIFEST:?package committed source first}"
            : "${SOURCE_PUBLIC_URL:?publish matching source first}"
            : "${RELEASE_IMAGE:?select the verified image}"
            python3 publish-release.py "$SOURCE_MANIFEST" "$RELEASE_IMAGE" --source-url "$SOURCE_PUBLIC_URL"
