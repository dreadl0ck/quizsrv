#                    Build System
#                          v0.8.5
#



# default language
language: bash

# globals for all commands
globals:
    # Keep in step with the image tag the Dokploy application pulls. This is a
    # docker-source application: a git push deploys nothing, so the sequence is
    # bump VERSION -> zeus make-docker -> point Dokploy at the new tag.
    VERSION: v0.3.16
    # The build previously tagged dreadl0ck/quizsrv, which is Docker Hub and is
    # not where anything deploys from. sne.dreadl0ck.net pulls this:
    IMAGE: registry.amsterdam-technologies.com/library/quizsrv

# command data
commands:
    
    # build the binary
    build:
        description: build project
        dependencies:
            - clean
        buildNumber: true
        exec: |
            go build -o bin/quizsrv

    run-local:
        description: run the server locally
        exec: go run *.go

    # clean up the mess
    clean:
        description: clean up to prepare for build
        exec: rm -rf bin/*

    make-docker:
        dependencies:
            - build-docker
            - push-docker
        exec: echo done

    build-docker:
        dependencies:
            - clean
        description: build docker container
        exec: |
            cp -rf courses files pages docker
            # Strip AppleDouble sidecars before they reach the build context.
            # On macOS, tar and cp materialise ._* companions from extended
            # attributes; the server then parses ._course.yml as YAML, dies with
            # "control characters are not allowed", and swarm rolls the task
            # back to the previous tag while the deploy still reports success.
            find docker \( -name '._*' -o -name '.DS_Store' \) -delete
            GOARCH=amd64 GOOS=linux CGO_ENABLED=0 go build -ldflags "-X main.Version=${VERSION}" -o docker/quizsrv *.go
            docker build --platform=linux/amd64 --build-arg VERSION=${VERSION} -t ${IMAGE}:${VERSION} docker
            rm -vf docker/quizsrv
            docker push ${IMAGE}:${VERSION}
    push-docker:
        exec: |
            docker push ${IMAGE}:${VERSION}
