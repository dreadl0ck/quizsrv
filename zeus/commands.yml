#                    Build System
#                          v0.8.5
#



# default language
language: bash

# globals for all commands
globals:
    # Production compilation runs in Dokploy from a published source archive.
    VERSION: v0.3.20
    # The build previously tagged dreadl0ck/quizsrv, which is Docker Hub and is
    # not where anything deploys from. sne.dreadl0ck.net pulls this:
    IMAGE: registry.amsterdam-technologies.com/library/quizsrv

# command data
commands:
    
    # build the binary
    build:
        description: build project
        dependencies:
            - clean
        buildNumber: true
        exec: |
            go build -o bin/quizsrv

    run-local:
        description: run the server locally
        exec: go run .

    # clean up the mess
    clean:
        description: clean up to prepare for build
        exec: rm -rf bin/*

    make-docker:
        dependencies:
            - build-docker
        exec: echo done

    build-docker:
        description: queue the Dokploy source build
        exec: |
            set -eu
            : "${SOURCE_MANIFEST:?package committed source first}"
            python3 release.py "$SOURCE_MANIFEST"
    push-docker:
        exec: |
            set -eu
            printf '%s\n' 'Image publication is handled by Dokploy; use zeus build-docker.' >&2
            exit 1
